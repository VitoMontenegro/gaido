services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: tourister
      POSTGRES_PASSWORD: tourister
      POSTGRES_DB: tourister
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourister -d tourister"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Next.js (local only). Go API stays on the Mac host (:8091).
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://host.docker.internal:8091
      NEXT_PUBLIC_BUILD_ID: dev
      HOSTNAME: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -w @gaido/web"]

volumes:
  pgdata:
  web_node_modules:
