name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tourister
          POSTGRES_PASSWORD: tourister
          POSTGRES_DB: tourister
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://tourister:tourister@localhost:5433/tourister?sslmode=disable
      REDIS_URL: redis://localhost:6380/0
      REDIS_SESSION_URL: redis://localhost:6380/1
      REDIS_SIGNAL_URL: redis://localhost:6380/2
      SEED_DEMO_DATA: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Migrate
        run: cd backend && go run ./cmd/migrate -cmd up

      - name: Vet
        run: make vet

      - name: Go test
        run: cd backend && go test ./...

      - name: Frontend install
        run: npm ci

      - name: Frontend lint
        run: make lint-frontend

      - name: Frontend test
        run: npm run test -w @gaido/api-client && npm run test -w @gaido/ui-primitives

      - name: Frontend build
        run: npm run build
