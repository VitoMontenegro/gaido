server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN svit.YOUR_DOMAIN vezu.YOUR_DOMAIN servis.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Cache-Control задаёт Go-бэкенд (immutable для /assets, /images, /fonts, media).
# Не добавляйте add_header Cache-Control в location / — иначе затирается кеш статики.

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    client_max_body_size 12m;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Cache-Control;
    }
}

